<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>VitaVerse 廣告戰情室</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&family=Archivo+Black&family=Noto+Sans+TC:wght@500;700&display=swap">
<style>
:root{--lime:#CDEF3A;--ink:#12140F;--ink-2:#3E4437;--paper:#FFFDF4;--paper-2:#F3F0E1;--coral:#FF8E76;--pink:#FFB6DD}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--lime);background-image:radial-gradient(rgba(18,20,15,.13) 1.6px,transparent 1.6px);background-size:24px 24px;
  color:var(--ink);font-family:'Archivo','Noto Sans TC',-apple-system,'Segoe UI',sans-serif;
  display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.box{width:100%;max-width:400px;background:var(--paper);border:2.5px solid var(--ink);border-radius:24px;box-shadow:6px 6px 0 var(--ink);padding:30px 28px 26px}
.brand{font-family:'Archivo Black','Noto Sans TC',sans-serif;font-size:25px;line-height:1.2;letter-spacing:-.02em}
.brand span{background:var(--lime);border-radius:4px;padding:0 4px}
.sub{font-size:14px;font-weight:500;color:var(--ink-2);margin:8px 0 22px}
label.f{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
input[type=password]{width:100%;font:inherit;font-size:17px;padding:12px 14px;border:2.5px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink)}
input[type=password]:focus{outline:none;box-shadow:3px 3px 0 var(--ink)}
.remember{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;margin:14px 0 18px;cursor:pointer}
.remember input{width:17px;height:17px;accent-color:var(--ink)}
button{width:100%;font:inherit;font-size:16px;font-weight:700;padding:12px;border:2.5px solid var(--ink);border-radius:999px;background:var(--ink);color:var(--lime);cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
button:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
button[disabled]{opacity:.6;cursor:wait;transform:none}
.err{margin-top:14px;font-size:13.5px;font-weight:700;background:var(--coral);border:2px solid var(--ink);border-radius:12px;padding:8px 12px}
.note{margin-top:18px;font-size:12px;font-weight:500;color:var(--ink-2);line-height:1.6}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="box" id="box">
  <div class="brand">VitaVerse <span>廣告戰情室</span></div>
  <div class="sub">公司內部報表，請輸入密碼</div>
  <form id="f" autocomplete="on">
    <input type="text" name="username" value="vitaverse" autocomplete="username" hidden>
    <label class="f" for="pw">密碼</label>
    <input type="password" id="pw" name="password" autocomplete="current-password" required autofocus>
    <label class="remember"><input type="checkbox" id="rem" checked>記住這台裝置，下次不用再輸入</label>
    <button type="submit" id="go">打開報表</button>
    <div class="err" id="err" role="alert" hidden></div>
  </form>
  <div class="note">密碼請問行銷部。用公用電腦的話，請把「記住這台裝置」取消勾選。</div>
</main>

      document.documentElement.lang = doc.documentElement.lang || "zh-Hant";
      while (document.head.firstChild) document.head.removeChild(document.head.firstChild);
      Array.prototype.forEach.call(doc.head.childNodes, function(n){ document.head.appendChild(document.importNode(n, true)); });
      var body = document.importNode(doc.body, true);
      document.documentElement.replaceChild(body, document.body);
      // DOMParser 解析出來的 script 不會執行，要重建一份才會跑
      Array.prototype.forEach.call(body.querySelectorAll("script"), function(old){
        var s = document.createElement("script");
        Array.prototype.forEach.call(old.attributes, function(a){ s.setAttribute(a.name, a.value); });
        s.textContent = old.textContent;
        old.parentNode.replaceChild(s, old);
      });
      window.scrollTo(0, 0);
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", swap); else swap();
  }
  function save(raw){ try { localStorage.setItem(STORE, JSON.stringify({ salt:P.salt, k:b64(raw) })); } catch(e) {} }
  function forget(){ try { localStorage.removeItem(STORE); } catch(e) {} }
  function fail(msg){ var e = document.getElementById("err"); e.textContent = msg; e.hidden = false; }

  if (!window.crypto || !crypto.subtle) {
    fail("這個瀏覽器沒辦法解開報表。請用 https 網址、Chrome 或 Safari 打開。");
    document.getElementById("go").disabled = true;
    return;
  }

  // 記住過的裝置：直接打開
  try {
    var saved = JSON.parse(localStorage.getItem(STORE) || "null");
    if (saved && saved.salt === P.salt) {
      document.getElementById("box").style.visibility = "hidden";
      open(bytes(saved.k)).then(show).catch(function(){ forget(); document.getElementById("box").style.visibility = ""; });
    } else if (saved) { forget(); }
  } catch(e) {}

  document.getElementById("f").addEventListener("submit", function(ev){
    ev.preventDefault();
    var pw = document.getElementById("pw").value, btn = document.getElementById("go");
    document.getElementById("err").hidden = true;
    if (!pw) { fail("請先輸入密碼。"); return; }
    btn.disabled = true; btn.textContent = "解鎖中…";
    derive(pw).then(function(raw){
      return open(raw).then(function(html){
        if (document.getElementById("rem").checked) save(raw); else forget();
        show(html);
      });
    }).catch(function(){
      btn.disabled = false; btn.textContent = "打開報表";
      fail("密碼不對，再試一次。");
      document.getElementById("pw").select();
    });
  });
})();
</script>
</body>
</html>
